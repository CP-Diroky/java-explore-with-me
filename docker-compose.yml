services:
  stats-server:
    build:
      context: ./stats
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy

  ewm-service:
    build:
      context: ./main-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      ewm-db:
        condition: service_healthy

  stats-db:
    image: postgres:16.1
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: statsdb
      POSTGRES_USER: Diyor
      POSTGRES_PASSWORD: 4515

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      timeout: 5s
      interval: 5s
      retries: 10


  ewm-db:
    image: postgres:16.1
    environment:
      POSTGRES_DB: ewmdb
      POSTGRES_USER: Diyor
      POSTGRES_PASSWORD: 4515

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      timeout: 5s
      interval: 5s
      retries: 10